name: Targeted notebook regression
on:
  pull_request:
  push:
    branches: ['audit/final-agriculture-validation']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scikit-learn
      - run: python -m pip check
      - run: python tests/regression.py
